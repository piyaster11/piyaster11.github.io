<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Sites · เว็บของฉัน</title><style>
body{margin:0;background:#141414;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}
header{padding:28px 4vw 10px;background:linear-gradient(#000,#141414)}h1{margin:0;color:#e50914;font-size:34px;letter-spacing:1px}
.sub{color:#aaa;margin:4px 0 16px}#q{width:100%;max-width:520px;padding:12px 16px;border-radius:8px;border:1px solid #333;background:#222;color:#fff;font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.chip{padding:8px 16px;border-radius:20px;background:#2a2a2a;border:0;color:#ddd;font-size:15px;cursor:pointer}.chip.on{background:#e50914;color:#fff}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;padding:10px 4vw 40px}
a.card{display:block;background:#1f1f1f;border-radius:10px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .2s,box-shadow .2s}
a.card:hover{transform:scale(1.04);box-shadow:0 8px 30px #000c}.th{aspect-ratio:16/10;background:#333 center/cover;display:flex;align-items:center;justify-content:center;font-size:60px}
.b{padding:12px 14px}.t{font-weight:700;font-size:17px}.tt{color:#bbb;font-size:14px}.d{color:#999;font-size:13px;margin-top:6px}.tag{float:right;font-size:11px;background:#e50914;padding:2px 8px;border-radius:10px}
</style></head><body><header><h1>MY SITES</h1><div class="sub">Everything I've built · เว็บทั้งหมดของฉัน</div>
<input id="q" placeholder="Search / ค้นหา..."><div class="chips" id="chips"></div></header><main id="g"></main>
<script>
const L={All:"All · ทั้งหมด",Business:"Business · ธุรกิจ",Shop:"Shop · ร้านค้า",Maps:"Maps · แผนที่",Fun:"Fun · บันเทิง",Tools:"Tools · เครื่องมือ",Other:"Other · อื่นๆ"};
let S=[],cat="All";const e=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
fetch("sites.json?"+Date.now()).then(r=>r.json()).then(d=>{S=d;const cs=["All",...new Set(d.map(s=>s.cat))];
chips.innerHTML=cs.map(c=>`<button class="chip${c=="All"?" on":""}" data-c="${c}">${L[c]||c}</button>`).join("");draw()});
chips.onclick=ev=>{const b=ev.target.closest(".chip");if(!b)return;cat=b.dataset.c;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x==b));draw()};
q.oninput=draw;function draw(){const k=q.value.toLowerCase();g.innerHTML=S.filter(s=>(cat=="All"||s.cat==cat)&&JSON.stringify(s).toLowerCase().includes(k)).map(s=>
`<a class="card" href="${e(s.url)}" target="_blank" rel="noopener"><div class="th" style="${s.thumb?`background-image:url(${e(s.thumb)})`:""}">${s.thumb?"":s.emoji}</div>
<div class="b"><span class="tag">${e(s.cat)}</span><div class="t">${s.emoji} ${e(s.title.split(/[·|—–]/)[0].trim())}</div><div class="tt">${e(s.th)}</div><div class="d">${e(s.desc)}</div></div></a>`).join("")||"<p>No sites found</p>"}
</script></body></html>
