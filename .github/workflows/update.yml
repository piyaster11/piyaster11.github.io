name: Update site list
on: {schedule: [{cron: "0 0 * * *"}], workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 gen.py
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add sites.json; git diff --cached --quiet || (git commit -m "Update sites" && git push)
